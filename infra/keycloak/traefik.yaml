http:
  routers:
    alkemata-auth:
      entryPoints: [websecure]
      rule: "Host(`auth.alkemata.com`)"
      service: alkemata-auth
      tls:
        certResolver: myresolver
  services:
    alkemata-auth:
      loadBalancer:
        servers:
          - url: "http://172.17.0.1:18081"
        passHostHeader: true
