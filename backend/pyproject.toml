[project]
name = "alkemata-knowledge-map-backend"
version = "1.0.0"
description = "Persistent knowledge map API and MCP server"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "fastapi==0.142.2",
  "mcp==2.2.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.6",
  "python-multipart==0.0.32",
  "sqlalchemy==2.1.2",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.0.2", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

